# 跬步（kuibu）自动合并
#
# 给 PR 打上 automerge 标签后，CI 通过就自动 squash 合并；PR 还带 release:patch /
# release:minor / release:major 标签时，合并后接着打 tag 并触发 Release。
#
# 触发：
#   - pull_request_target labeled：刚打上 automerge 标签。CI 已经通过就立即合并，
#     还在跑就先退出，等 CI 跑完的那次触发。
#   - workflow_run（CI completed）：PR 的 CI 跑完。成功且带 automerge 标签就合并。
#
# 安全：两种触发都以本仓库的写权限运行，所以这里只检出 main 上的脚本，绝不检出
# 或执行 PR 里的代码；脚本也不会自动合并来自 fork 的 PR。能打标签的人至少有
# triage 权限，标签本身就是授权。
#
# 逻辑在 .github/scripts/auto-merge.sh 与 release-from-pr.sh 里。

name: Auto merge

on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: CI 通过后合并
    if: >-
      (github.event_name == 'pull_request_target' && github.event.label.name == 'automerge') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main（只取脚本与 tags）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: 合并并按标签发版
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/auto-merge.sh "$PR_NUMBER" "$HEAD_SHA"
