<!doctype html><html><head><meta charset="utf-8"><title>托盘图标候选</title>
<style>
body{font-family:-apple-system,sans-serif;margin:24px;background:#f4f4f4}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;margin-bottom:28px}
.card{text-align:center;font-size:13px}
.bar{display:flex;align-items:center;gap:14px;height:24px;padding:0 12px;border-radius:6px;margin:6px 0}
.light{background:#ececec}.dark{background:#2a2a2a}
.bar img{width:22px;height:22px}
.dark img{filter:invert(1)}
.big{width:88px;height:88px;background:#fff;border:1px solid #ddd;border-radius:8px}
.sys{width:16px;height:16px;border-radius:3px;background:#777;opacity:.6}
</style></head><body>
<div class="row">
<div class="card"><img class="big" src="../tray-template.png"><div>现在（台阶）</div>
<div class="bar light"><span class="sys"></span><img src="../tray-template.png"><span class="sys"></span></div>
<div class="bar dark"><span class="sys"></span><img src="../tray-template.png"><span class="sys"></span></div></div>
<div class="card"><img class="big" src="a-footprint.svg"><div>A 一枚脚印</div>
<div class="bar light"><span class="sys"></span><img src="a-footprint.svg"><span class="sys"></span></div>
<div class="bar dark"><span class="sys"></span><img src="a-footprint.svg"><span class="sys"></span></div></div>
<div class="card"><img class="big" src="b-two-steps.svg"><div>B 两枚脚印</div>
<div class="bar light"><span class="sys"></span><img src="b-two-steps.svg"><span class="sys"></span></div>
<div class="bar dark"><span class="sys"></span><img src="b-two-steps.svg"><span class="sys"></span></div></div>
<div class="card"><img class="big" src="c-path-step.svg"><div>C 一步步到一点</div>
<div class="bar light"><span class="sys"></span><img src="c-path-step.svg"><span class="sys"></span></div>
<div class="bar dark"><span class="sys"></span><img src="c-path-step.svg"><span class="sys"></span></div></div>
</div></body></html>
